[workspace]
members = ["apl-ai-eval", "apl-ats"]

[package]
name = "apl-core"
version = "0.19.1"
edition = "2021"
rust-version = "1.75.0"
license = "Apache-2.0"
description = "Pure verification library for APL Protocol v0.1 (Anchored Parallax Log) — reference APL-on-ATL profile"
repository = "https://github.com/evidentum-io/apl-core"
keywords = ["apl", "frame-bound-observation", "verification", "content-addressed"]
categories = ["cryptography", "data-structures"]

[dependencies]
atl-core = { path = "../../vendor/atl-core", version = "0.23" }

# JSON and serialization.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# SHA-256 for canonical hash computation.
sha2 = "0.10"

# Hex encoding and decoding utilities.
hex = "0.4"

# Error derive macros.
thiserror = "1"

[dev-dependencies]
proptest = "1"
pretty_assertions = "1"

[features]
default = []
# Feature flags for optional profiles.
