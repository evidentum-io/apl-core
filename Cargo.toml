[workspace]
members = ["apl-ai-eval"]

[package]
name = "apl-core"
version = "0.17.1"
edition = "2021"
rust-version = "1.75.0"
license = "Apache-2.0"
description = "Pure verification library for APL Protocol v0.1 (Anchored Parallax Log) — reference APL-on-ATL profile"
repository = "https://github.com/evidentum-io/apl-core"
keywords = ["apl", "frame-bound-observation", "verification", "content-addressed"]
categories = ["cryptography", "data-structures"]

[dependencies]
# Peer crate: carrier reference + JCS implementation.
# apl-core uses atl-core for:
#   - `atl_core::jcs::canonicalize` / `canonicalize_and_hash`
#   - reference carrier model only; the actual CarrierVerifier impl lives in apl-cli.
atl-core = { path = "../../../evidentum.io/atl-core", version = "0.23" }

# JSON and serialization.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# SHA-256 for recomputing canonical hash of JCS bytes (identity check, apl-spec.md §9.5).
sha2 = "0.10"

# Hex for parsing "sha256:<hex>" strings (apl-spec.md §4.2).
hex = "0.4"

# Error derive macros.
thiserror = "1"

[dev-dependencies]
proptest = "1"
pretty_assertions = "1"

[features]
default = []
# Future profiles will gate here (e.g. profile-photojournalism).
