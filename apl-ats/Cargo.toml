[package]
name = "apl-ats"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
license = "Apache-2.0"
description = "APL/ATS vertical profile for APL Protocol (Analytic Tradecraft Standards)"
repository = "https://github.com/evidentum-io/apl-core"
keywords = ["apl", "ats", "tradecraft", "verification", "profile"]
categories = ["cryptography"]

[lints.rust]
unsafe_code = "deny"

[dependencies]
apl-core = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
hex = "0.4"
proptest = "1"
pretty_assertions = "1"
